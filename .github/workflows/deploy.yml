name: Deploy to GitHub Pages

# Several presentations, one site. decks.json decides the URLs and nothing else
# does: the first non-draft deck in the manifest takes the repository root and
# the rest hang off it at /<file without .md>/, so they share a deploy and the
# links between them need no base baked in:
#
#   https://<owner>.github.io/<repo>/              la bilingüe (primera del manifiesto)
#   https://<owner>.github.io/<repo>/informativa/  la informativa, en castellano
#   https://<owner>.github.io/<repo>/enunciados/   cómo se escriben los enunciados
#   https://<owner>.github.io/<repo>/hallazgos/    qué dicen los datos de 2026
#
# To move a deck to the root, reorder decks.json — do NOT add build steps here.
# The build runs tools/build_all.mjs, the same script `npm run build` uses, so a
# local build and a deploy cannot disagree about which deck owns the root.
#
# The entry files are generated from bloques/ + decks.json, so the build
# regenerates them first: a slide edited in the pool reaches every deck that
# uses it, and a stale committed entry file cannot be published by accident.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Regenerate the entry files from the slide pool
        run: npm run decks

      # `npm run decks` writes only the entry files named in decks.json, so any
      # difference at all means one of them was committed stale.
      - name: Fail if a generated entry file was committed stale
        run: |
          if ! git diff --quiet; then
            echo "::error::A generated entry file differs from what bloques/ + decks.json generate."
            echo "Run 'npm run decks' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      # Root first, then the companions: Vite empties its output directory, so
      # building the root last would take the others with it. build_all.mjs
      # handles that ordering from decks.json.
      - name: Build every non-draft deck
        run: node tools/build_all.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
